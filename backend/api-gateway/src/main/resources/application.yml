server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: github-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/github/**
        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/ai/**
        - id: analytics-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/analytics/**
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**