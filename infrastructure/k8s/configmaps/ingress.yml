apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devpulse-ingress
  namespace: devpulse-ai
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: api.devpulse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080